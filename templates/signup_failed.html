{% extends "base.html" %}
{% block content %}    
<main class="page-shell">
    <section class="panel error-page">
        <h1>Sign up failed</h1>
        <p class="muted">We couldn't create your account. This may be because:</p>

        <ul>
            <li>Your username or email already exists</li>
            <li>One or more fields are empty</li>
        </ul>

        <form action="/" method="get">
            <button type="submit">Return to sign up</button>
        </form>
    </section>
</main>
{% endblock %}
